<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공부 트래커 (구글 로그인 전용)</title>
    <!-- Chart.js 라이브러리 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* =========================================
           CSS 스타일 (스타일링 캡슐화)
           ========================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .page {
            display: none;
            flex-direction: column;
            padding: 24px;
            height: 100%;
            animation: fadeIn 0.3s ease;
            overflow-y: auto;
        }

        .page.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        p {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }

        /* 버튼 스타일 */
        button {
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .primary-btn {
            background-color: #4CAF50;
            color: white;
            width: 100%;
        }

        .primary-btn:hover { background-color: #45a049; }

        .danger-btn {
            background-color: #f44336;
            color: white;
            width: 100%;
        }

        .danger-btn:hover { background-color: #da190b; }

        .icon-btn {
            background: none;
            padding: 8px;
            color: #555;
            font-size: 14px;
            width: auto;
        }

        .large-btn {
            margin-top: auto;
            margin-bottom: 20px;
        }

        /* 과목 그리드 */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .subject-btn {
            background-color: #f0f0f0;
            color: #333;
            padding: 20px;
            font-size: 16px;
            border-radius: 12px;
        }

        .subject-btn:hover { background-color: #e0e0e0; }

        /* 타이머 */
        .timer-display {
            font-size: 56px;
            font-weight: bold;
            text-align: center;
            margin: 60px 0;
            font-variant-numeric: tabular-nums;
            color: #2c3e50;
        }

        /* 입력폼 */
        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 30px;
        }

        .input-group label {
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        .input-group input {
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        
        .input-group input:focus {
            border-color: #4CAF50;
        }

        /* 그래프 영역 */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 0;
            flex-grow: 1;
            text-align: center;
        }
        .chart-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            min-height: 250px;
            margin-bottom: 20px;
        }

        /* 로그인 정보 UI */
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #e8f5e9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #2e7d32;
        }
        .logout-btn {
            padding: 6px 12px;
            font-size: 12px;
            background-color: transparent;
            border: 1px solid #2e7d32;
            color: #2e7d32;
            border-radius: 4px;
        }

        /* 에러 메시지 박스 */
        #loginError {
            display: none;
            background-color: #ffebee;
            color: #c62828;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.5;
            text-align: left;
            border: 1px solid #ffcdd2;
        }
        
        .domain-highlight {
            display: block;
            background: #fff;
            padding: 8px;
            margin: 8px 0;
            border-radius: 4px;
            font-weight: bold;
            color: #d32f2f;
            user-select: all;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 1. 로그인 페이지 -->
        <div id="loginPage" class="page active">
            <h1 style="margin-top: 40px;">📚 공부 트래커</h1>
            <p>구글 계정으로 로그인하고 기록을 시작하세요!</p>
            <button id="loginBtn" class="primary-btn" style="margin-top: 20px;">Google 계정으로 로그인</button>
            
            <!-- 에러 발생 시 도메인을 정확히 알려주는 UI -->
            <div id="loginError"></div>
        </div>

        <!-- 2. 과목 선택 페이지 -->
        <div id="subjectPage" class="page">
            <div class="user-info" id="userInfoDisplay">
                <span id="userEmailText">사용자 이메일</span>
                <button id="logoutBtn" class="logout-btn">로그아웃</button>
            </div>
            <h2>어떤 과목을 볼까요?</h2>
            <div id="subjectList" class="grid-container"></div>
        </div>

        <!-- 3. 그래프 페이지 -->
        <div id="graphPage" class="page">
            <div class="header">
                <button id="backToSubjectsBtn" class="icon-btn">◀ 과목 목록</button>
                <h2 id="graphSubjectTitle">과목명</h2>
                <div style="width: 70px;"></div> <!-- 중앙 정렬용 여백 -->
            </div>
            <div class="chart-container">
                <canvas id="studyChart"></canvas>
            </div>
            <button id="startStudyBtn" class="primary-btn large-btn">⏱️ 공부 시작하기</button>
        </div>

        <!-- 4. 타이머 페이지 -->
        <div id="timerPage" class="page">
            <h2 id="timerSubjectTitle" style="margin-top: 40px;">과목명</h2>
            <p>집중해서 공부를 진행하세요.</p>
            <div class="timer-display" id="timerDisplay">00:00:00</div>
            <button id="stopStudyBtn" class="danger-btn large-btn">⏹️ 공부 종료</button>
        </div>

        <!-- 5. 문제 수 입력 페이지 -->
        <div id="problemPage" class="page">
            <h2 style="margin-top: 40px;">수고하셨습니다! 🎉</h2>
            <p id="resultTimeText" style="font-size: 18px; font-weight: bold; color: #4CAF50;">오늘 공부한 시간: 0분</p>
            <div class="input-group">
                <label for="problemInput">푼 문제 수를 입력하세요 (선택)</label>
                <input type="number" id="problemInput" placeholder="예: 25" min="0">
            </div>
            <button id="saveSessionBtn" class="primary-btn large-btn">기록 저장하기</button>
        </div>
    </div>

    <!-- =========================================
         Firebase 및 메인 로직 스크립트
         ========================================= -->
    <script type="module">
        // 1. Firebase v12.10.0 모듈 임포트
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

        // 2. 제공해주신 Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyAwJctLPQDWc9hFQv5BdizuS_t0iLT9xKY",
            authDomain: "game-28340361-be8ef.firebaseapp.com",
            projectId: "game-28340361-be8ef",
            storageBucket: "game-28340361-be8ef.firebasestorage.app",
            messagingSenderId: "183534954954",
            appId: "1:183534954954:web:902ff83bf9fe206e758733"
        };

        // 3. 초기화
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 상태 관리 변수
        let currentUser = null;
        let currentSubject = "";
        let startTime = null;
        let endTime = null;
        let timerInterval = null;
        let chartInstance = null; 

        const subjects = ["국어", "수학", "영어", "과학 탐구", "사회 탐구", "진로과목"];

        // -------------------------------------------------------------
        // 화면 전환 유틸리티
        // -------------------------------------------------------------
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // -------------------------------------------------------------
        // 로그인 & 로그아웃 로직 (화면 이동 방식 - 모바일 최적화)
        // -------------------------------------------------------------
        document.getElementById('loginBtn').onclick = async () => {
            const provider = new GoogleAuthProvider();
            const errorBox = document.getElementById('loginError');
            errorBox.style.display = 'none';
            
            try {
                // 모바일 환경을 고려한 Redirect 방식
                await signInWithRedirect(auth, provider);
            } catch (error) {
                console.error("로그인 시작 에러:", error);
                
                if (error.code === 'auth/unauthorized-domain') {
                    const currentDomain = window.location.hostname || "현재 브라우저 주소"; 
                    
                    errorBox.innerHTML = `
                        <strong>🚨 승인되지 않은 도메인입니다!</strong><br><br>
                        Firebase 보안 설정 때문에 로그인이 차단되었습니다. 아래의 주소를 Firebase 콘솔에 추가해주세요.<br>
                        <span class="domain-highlight">${currentDomain}</span>
                        <strong>[해결 방법]</strong><br>
                        1. Firebase 콘솔 접속<br>
                        2. Authentication > Settings(설정) > 승인된 도메인(Authorized domains) 이동<br>
                        3. 위 주소를 '도메인 추가'를 눌러 등록 후 새로고침
                    `;
                    errorBox.style.display = 'block';
                } else {
                    errorBox.innerText = "로그인 요청 중 오류가 발생했습니다: " + error.message;
                    errorBox.style.display = 'block';
                }
            }
        };

        // 구글 로그인 화면에서 돌아왔을 때의 결과를 처리합니다.
        getRedirectResult(auth).catch((error) => {
            console.error("로그인 결과 에러:", error);
            const errorBox = document.getElementById('loginError');
            
            if (error.code === 'auth/unauthorized-domain') {
                const currentDomain = window.location.hostname || "현재 브라우저 주소";
                
                errorBox.innerHTML = `
                    <strong>🚨 승인되지 않은 도메인입니다!</strong><br><br>
                    Firebase 보안 설정 때문에 로그인이 차단되었습니다. 아래의 주소를 Firebase 콘솔에 추가해주세요.<br>
                    <span class="domain-highlight">${currentDomain}</span>
                    <strong>[해결 방법]</strong><br>
                    1. Firebase 콘솔 접속<br>
                    2. Authentication > Settings(설정) > 승인된 도메인(Authorized domains) 이동<br>
                    3. 위 주소를 '도메인 추가'를 눌러 등록 후 새로고침
                `;
                errorBox.style.display = 'block';
            } else {
                errorBox.innerText = "로그인 결과 처리 중 오류가 발생했습니다: " + error.message;
                errorBox.style.display = 'block';
            }
        });

        document.getElementById('logoutBtn').onclick = async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("로그아웃 에러:", error);
            }
        };

        // 로그인 상태 감지 리스너
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // 이전에 혹시 남은 게스트 계정이 있다면 깔끔하게 로그아웃 처리
                if (user.isAnonymous) {
                    console.log("익명 계정 감지됨. 로그아웃 처리.");
                    signOut(auth);
                    return;
                }
                currentUser = user;
                document.getElementById('userEmailText').innerText = user.email || user.displayName;
                document.getElementById('loginError').style.display = 'none';
                renderSubjectPage();
                showPage("subjectPage");
            } else {
                currentUser = null;
                showPage("loginPage");
            }
        });

        // -------------------------------------------------------------
        // 과목 페이지 렌더링
        // -------------------------------------------------------------
        function renderSubjectPage() {
            const list = document.getElementById('subjectList');
            list.innerHTML = '';
            subjects.forEach(sub => {
                const btn = document.createElement('button');
                btn.className = 'subject-btn';
                btn.innerText = sub;
                btn.onclick = () => {
                    currentSubject = sub;
                    document.getElementById('graphSubjectTitle').innerText = sub;
                    loadGraphData(sub); 
                    showPage("graphPage");
                };
                list.appendChild(btn);
            });
        }

        document.getElementById('backToSubjectsBtn').onclick = () => {
            showPage("subjectPage");
        };

        // -------------------------------------------------------------
        // 그래프 데이터 로드 및 렌더링 로직 (Chart.js)
        // -------------------------------------------------------------
        async function loadGraphData(subject) {
            if (!currentUser) return;

            let snapshot;
            try {
                // 로그인한 유저의 UID를 경로로 사용하여 보안 규칙 완벽 대응
                const q = query(
                    collection(db, "users", currentUser.uid, "study_sessions"),
                    where("subject", "==", subject)
                );
                snapshot = await getDocs(q);
            } catch (e) {
                console.error("데이터 로드 에러:", e);
                alert("데이터를 불러오지 못했습니다. 권한 설정을 확인해주세요.");
                return;
            }

            const dateMap = {};

            // 날짜별 공부시간 합산
            snapshot.forEach(doc => {
                const data = doc.data();
                if (dateMap[data.date]) {
                    dateMap[data.date] += data.duration;
                } else {
                    dateMap[data.date] = data.duration;
                }
            });

            // 날짜 오름차순 정렬
            const sortedDates = Object.keys(dateMap).sort();
            const durations = sortedDates.map(date => dateMap[date]);

            const labels = sortedDates.map(date => {
                const d = new Date(date);
                return `${d.getMonth() + 1}/${d.getDate()}`;
            });

            drawChart(labels, durations);
        }

        function drawChart(labels, data) {
            const ctx = document.getElementById('studyChart').getContext('2d');
            if (chartInstance) {
                chartInstance.destroy();
            }
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '총 공부 시간 (분)',
                        data: data,
                        borderColor: '#4CAF50',
                        backgroundColor: 'rgba(76, 175, 80, 0.2)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#4CAF50',
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { 
                            beginAtZero: true,
                            suggestedMax: Math.max(...data, 60)
                        }
                    }
                }
            });
        }

        // -------------------------------------------------------------
        // 타이머 로직
        // -------------------------------------------------------------
        document.getElementById('startStudyBtn').onclick = () => {
            document.getElementById('timerSubjectTitle').innerText = currentSubject;
            startTime = new Date();
            document.getElementById('timerDisplay').innerText = "00:00:00";
            timerInterval = setInterval(updateTimer, 1000);
            showPage("timerPage");
        };

        function updateTimer() {
            const now = new Date();
            const diff = now - startTime;
            
            const sec = Math.floor((diff / 1000) % 60);
            const min = Math.floor((diff / 60000) % 60);
            const hr = Math.floor(diff / 3600000);

            const formattedTime = 
                String(hr).padStart(2, '0') + ":" + 
                String(min).padStart(2, '0') + ":" + 
                String(sec).padStart(2, '0');
                
            document.getElementById('timerDisplay').innerText = formattedTime;
        }

        document.getElementById('stopStudyBtn').onclick = () => {
            clearInterval(timerInterval);
            endTime = new Date();
            
            const duration = Math.floor((endTime - startTime) / 60000);
            document.getElementById('resultTimeText').innerText = `방금 ${duration}분 동안 공부했어요!`;
            document.getElementById('problemInput').value = "";
            
            showPage("problemPage");
        };

        // -------------------------------------------------------------
        // Firestore 데이터 저장 로직
        // -------------------------------------------------------------
        document.getElementById('saveSessionBtn').onclick = async () => {
            if (!currentUser) return;

            const btn = document.getElementById('saveSessionBtn');
            btn.disabled = true;
            btn.innerText = "저장 중...";

            const duration = Math.floor((endTime - startTime) / 60000);
            const problems = Number(document.getElementById('problemInput').value) || 0;
            
            // 로컬 타임존 기준으로 현재 날짜 구하기 (YYYY-MM-DD)
            const offset = new Date().getTimezoneOffset() * 60000;
            const todayDate = new Date(Date.now() - offset).toISOString().split('T')[0];

            const sessionData = {
                subject: currentSubject,
                date: todayDate,
                startTime: startTime.toISOString(),
                endTime: endTime.toISOString(),
                duration: duration,
                problems: problems
            };

            try {
                // 로그인한 유저의 UID를 경로로 사용하여 데이터베이스 규칙 통과
                await addDoc(
                    collection(db, "users", currentUser.uid, "study_sessions"),
                    sessionData
                );
                
                loadGraphData(currentSubject);
                showPage("graphPage");
            } catch (error) {
                console.error("저장 에러:", error);
                alert("저장에 실패했습니다. 권한 설정을 확인해주세요.");
            } finally {
                btn.disabled = false;
                btn.innerText = "기록 저장하기";
            }
        };
    </script>
</body>
</html>
