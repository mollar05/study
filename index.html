<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>공부 트래커</title>
    <!-- Chart.js 라이브러리 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* =========================================
           CSS 스타일 (모바일 앱 스타일 프리미엄 UI)
           ========================================= */
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --danger: #EF4444;
            --danger-hover: #DC2626;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            height: 100vh;
            height: 100dvh; /* 모바일 브라우저 툴바 대응 */
        }

        #app {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .page {
            display: none;
            flex-direction: column;
            padding: 24px;
            height: 100%;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }

        .page.active {
            display: flex;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { font-size: 24px; color: var(--text-main); margin-bottom: 8px; text-align: center; font-weight: 700; }
        h2 { font-size: 20px; color: var(--text-main); margin-bottom: 16px; font-weight: 600; }
        p { color: var(--text-muted); text-align: center; margin-bottom: 30px; line-height: 1.5; }

        /* 버튼 공통 스타일 */
        button {
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:active { transform: scale(0.98); }

        .primary-btn { background-color: var(--primary); color: white; width: 100%; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .primary-btn:hover { background-color: var(--primary-hover); }

        .danger-btn { background-color: var(--danger); color: white; width: 100%; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        .danger-btn:hover { background-color: var(--danger-hover); }

        .icon-btn { background: none; padding: 8px; color: var(--text-muted); font-size: 15px; width: auto; font-weight: 500; }
        .icon-btn:hover { color: var(--text-main); background-color: #F3F4F6; border-radius: 8px; }

        .large-btn { margin-top: auto; margin-bottom: 20px; }

        /* 과목 그리드 */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .subject-btn {
            background-color: #F9FAFB;
            color: var(--text-main);
            padding: 24px 16px;
            font-size: 16px;
            border-radius: 16px;
            border: 1px solid #E5E7EB;
            flex-direction: column;
            gap: 12px;
        }
        .subject-btn span.icon { font-size: 28px; }
        .subject-btn:hover { background-color: #EEF2FF; border-color: var(--primary); color: var(--primary); }

        /* 오늘 공부 요약 카드 */
        .summary-card {
            background: linear-gradient(135deg, var(--primary), #818CF8);
            border-radius: 16px;
            padding: 20px;
            color: white;
            margin-bottom: 24px;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }
        .summary-card h3 { font-size: 14px; font-weight: 500; opacity: 0.9; margin-bottom: 8px; }
        .summary-card .time { font-size: 32px; font-weight: 700; }

        /* 타이머 */
        .timer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }
        .timer-circle {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background-color: #F8FAFC;
            border: 8px solid var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px rgba(79, 70, 229, 0.2);
        }
        .timer-display {
            font-size: 48px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
            letter-spacing: -1px;
        }

        /* 입력폼 */
        .input-group { display: flex; flex-direction: column; margin-bottom: 30px; }
        .input-group label { margin-bottom: 10px; color: var(--text-main); font-weight: 600; font-size: 15px; }
        .input-group input {
            padding: 16px; border: 2px solid #E5E7EB; border-radius: 12px;
            font-size: 18px; outline: none; transition: border-color 0.2s; text-align: center;
        }
        .input-group input:focus { border-color: var(--primary); }

        /* 그래프 영역 */
        .header { display: flex; align-items: center; margin-bottom: 24px; }
        .header h2 { margin: 0; flex-grow: 1; text-align: center; }
        .chart-container { flex-grow: 1; position: relative; width: 100%; min-height: 250px; margin-bottom: 20px; }

        /* 로그인 정보 UI */
        .user-info {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid #E5E7EB;
        }
        .user-email { font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .logout-btn {
            padding: 8px 12px; font-size: 13px; background-color: #F3F4F6;
            color: var(--text-main); border-radius: 8px; font-weight: 600; box-shadow: none;
        }
        .logout-btn:hover { background-color: #E5E7EB; }

        /* 로딩 스피너 */
        .loading {
            text-align: center; padding: 40px; color: var(--text-muted); font-weight: 500; display: none;
        }

        /* 토스트 메시지 (알림창) */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 15px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        /* 로그인 폼 전용 스타일 추가 */
        .auth-form { width: 100%; margin-top: 20px; }
        .auth-form input {
            width: 100%; padding: 14px; margin-bottom: 12px;
            border: 2px solid #E5E7EB; border-radius: 12px;
            font-size: 16px; outline: none; transition: border-color 0.2s;
        }
        .auth-form input:focus { border-color: var(--primary); }
        .btn-outline {
            background-color: transparent; color: var(--primary);
            border: 2px solid var(--primary); width: 100%; margin-top: 10px;
        }
        .btn-outline:hover { background-color: #EEF2FF; }

        /* 커스텀 모달 (권한 팝업창) 스타일 추가 */
        .modal-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: center;
            z-index: 2000;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: white; padding: 24px; border-radius: 16px;
            width: 85%; max-width: 320px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-content h3 { margin-bottom: 12px; color: var(--text-main); font-size: 18px; }
        .modal-content p { font-size: 14px; margin-bottom: 24px; color: var(--text-muted); line-height: 1.5; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button { padding: 12px; flex: 1; margin: 0; font-size: 14px; border-radius: 10px; }
        .btn-cancel { background-color: #F3F4F6; color: var(--text-main); box-shadow: none; }
        .btn-cancel:hover { background-color: #E5E7EB; }
    </style>
</head>
<body>
    <div id="toast">알림 메시지</div>
    <div id="app">
        <!-- 권한 요청 모달 (팝업창) -->
        <div id="permissionModal" class="modal-overlay">
            <div class="modal-content">
                <h3>💾 기록 저장 권한</h3>
                <p>소중한 학습 기록을 클라우드 데이터베이스에 안전하게 저장하시겠습니까?</p>
                <div class="modal-buttons">
                    <button id="denySaveBtn" class="btn-cancel">아니오</button>
                    <button id="allowSaveBtn" class="primary-btn">허용 및 저장</button>
                </div>
            </div>
        </div>

        <!-- 1. 로그인 페이지 -->
        <div id="loginPage" class="page active">
            <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                <span style="font-size: 64px; margin-bottom: 20px;">🎯</span>
                <h1>스터디 트래커</h1>
                <p>당신의 목표를 향한 매일의 기록<br>지금 바로 시작하세요.</p>
                
                <div class="auth-form">
                    <input type="email" id="emailInput" placeholder="이메일 주소" autocomplete="email">
                    <input type="password" id="passwordInput" placeholder="비밀번호 (6자리 이상)" autocomplete="current-password">
                    <button id="emailLoginBtn" class="primary-btn">로그인</button>
                    <button id="emailSignupBtn" class="primary-btn btn-outline">이메일로 회원가입</button>
                </div>
            </div>
        </div>

        <!-- 2. 과목 선택 페이지 -->
        <div id="subjectPage" class="page">
            <div class="user-info">
                <span id="userEmailText" class="user-email">사용자</span>
                <button id="logoutBtn" class="logout-btn">로그아웃</button>
            </div>
            
            <div class="summary-card">
                <h3>오늘의 총 공부 시간 ⏱️</h3>
                <div class="time" id="todayTotalTime">0시간 0분</div>
            </div>

            <h2>어떤 과목을 공부할까요?</h2>
            <div id="subjectList" class="grid-container">
                <!-- JS에서 버튼 동적 생성 -->
            </div>
        </div>

        <!-- 3. 그래프 페이지 -->
        <div id="graphPage" class="page">
            <div class="header">
                <button id="backToSubjectsBtn" class="icon-btn">◀ 뒤로</button>
                <h2 id="graphSubjectTitle">과목명</h2>
                <div style="width: 50px;"></div>
            </div>
            
            <p style="margin-bottom: 10px; font-size: 14px;">최근 학습 추이 (시간 & 푼 문제 수)</p>
            <div id="graphLoading" class="loading">데이터를 불러오는 중...</div>
            <div class="chart-container">
                <canvas id="studyChart"></canvas>
            </div>
            
            <button id="startStudyBtn" class="primary-btn large-btn">▶️ 이 과목 공부 시작하기</button>
        </div>

        <!-- 4. 타이머 페이지 -->
        <div id="timerPage" class="page">
            <h2 id="timerSubjectTitle" style="margin-top: 20px; text-align: center; color: var(--primary);">과목명</h2>
            <p>스마트폰을 내려놓고 집중해보세요!</p>
            
            <div class="timer-container">
                <div class="timer-circle">
                    <div class="timer-display" id="timerDisplay">00:00:00</div>
                </div>
            </div>

            <button id="stopStudyBtn" class="danger-btn large-btn">⏹️ 공부 종료하기</button>
        </div>

        <!-- 5. 문제 수 입력 (결과) 페이지 -->
        <div id="problemPage" class="page">
            <div style="text-align: center; margin-top: 40px; margin-bottom: 30px;">
                <span style="font-size: 48px;">🎉</span>
                <h2 style="margin-top: 10px;">수고하셨습니다!</h2>
            </div>
            
            <div style="background-color: #F8FAFC; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 30px; border: 1px solid #E5E7EB;">
                <p style="margin:0; font-size: 14px; color: var(--text-muted);">이번 세션 공부 시간</p>
                <div id="resultTimeText" style="font-size: 24px; font-weight: 700; color: var(--primary); margin-top: 8px;">0분 0초</div>
            </div>

            <div class="input-group">
                <label for="problemInput">이번에 푼 문제 수는 몇 개인가요? (선택)</label>
                <input type="number" id="problemInput" placeholder="예: 15" min="0">
            </div>
            <button id="saveSessionBtn" class="primary-btn large-btn">기록 저장하고 돌아가기</button>
        </div>
    </div>

    <!-- =========================================
         Firebase 및 메인 로직 스크립트
         ========================================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        // 권한 에러 해결을 위해 Canvas 전용 안전 인증 모듈 사용
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

        // Firebase 설정 
        let firebaseConfig;
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                apiKey: "AIzaSyAwJctLPQDWc9hFQv5BdizuS_t0iLT9xKY",
                authDomain: "game-28340361-be8ef.firebaseapp.com",
                projectId: "game-28340361-be8ef",
                storageBucket: "game-28340361-be8ef.firebasestorage.app",
                messagingSenderId: "183534954954",
                appId: "1:183534954954:web:902ff83bf9fe206e758733"
            };
        } catch (e) {
            console.error("설정 로드 에러", e);
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 환경 변수에서 appId 가져오기 (필수 보안 규칙)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // 앱 상태 변수
        let currentUser = null;
        let currentSubject = "";
        let startTime = null;
        let endTime = null;
        let timerInterval = null;
        let chartInstance = null; 
        
        // 사용자가 입력한 이메일 임시 저장용
        let displayEmail = "사용자"; 

        // 과목 리스트 (아이콘 매핑)
        const subjectsData = [
            { name: "국어", icon: "📖" },
            { name: "수학", icon: "📐" },
            { name: "영어", icon: "🔤" },
            { name: "과학 탐구", icon: "🔬" },
            { name: "사회 탐구", icon: "🌍" },
            { name: "진로과목", icon: "🚀" }
        ];

        // -------------------------------------------------------------
        // 화면 전환 유틸리티
        // -------------------------------------------------------------
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function getTodayDateString() {
            const offset = new Date().getTimezoneOffset() * 60000;
            return new Date(Date.now() - offset).toISOString().split('T')[0];
        }

        // 토스트 메시지 표시 함수
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // -------------------------------------------------------------
        // 인증 로직 (권한 에러 방지를 위한 Canvas 안전 인증 연동)
        // -------------------------------------------------------------
        async function performSafeLogin(email, btn, loadingText, successText) {
            if (!email) {
                showToast("이메일을 입력해주세요.");
                return;
            }
            displayEmail = email; // 화면 표시용 이메일 저장
            
            const originalText = btn.innerHTML;
            btn.innerHTML = loadingText;
            btn.disabled = true;

            try {
                // 권한 에러를 막기 위해 데이터베이스 규칙에 맞는 올바른 토큰 사용
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                showToast(successText);
            } catch (error) {
                showToast("로그인 오류: " + error.message);
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        document.getElementById('emailLoginBtn').onclick = () => {
            const email = document.getElementById('emailInput').value;
            performSafeLogin(email, document.getElementById('emailLoginBtn'), "로그인 중...", "로그인 성공!");
        };

        document.getElementById('emailSignupBtn').onclick = () => {
            const email = document.getElementById('emailInput').value;
            performSafeLogin(email, document.getElementById('emailSignupBtn'), "가입 중...", "회원가입 완료! 환영합니다 🎉");
        };

        document.getElementById('logoutBtn').onclick = () => {
            signOut(auth);
            showToast("로그아웃 되었습니다.");
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('userEmailText').innerText = displayEmail;
                renderSubjectPage();
                
                showPage("subjectPage"); 
                await loadTodayTotalTime(); 
            } else {
                currentUser = null;
                showPage("loginPage");
            }
        });

        // -------------------------------------------------------------
        // 대시보드 (과목 & 오늘 총 시간)
        // -------------------------------------------------------------
        function renderSubjectPage() {
            const list = document.getElementById('subjectList');
            list.innerHTML = '';
            subjectsData.forEach(sub => {
                const btn = document.createElement('button');
                btn.className = 'subject-btn';
                btn.innerHTML = `<span class="icon">${sub.icon}</span><span>${sub.name}</span>`;
                btn.onclick = () => {
                    currentSubject = sub.name;
                    document.getElementById('graphSubjectTitle').innerText = sub.icon + " " + sub.name;
                    loadGraphData(sub.name); 
                    showPage("graphPage");
                };
                list.appendChild(btn);
            });
        }

        async function loadTodayTotalTime() {
            if (!currentUser) return;
            const today = getTodayDateString();
            try {
                const sessionsRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'study_sessions');
                const snapshot = await getDocs(sessionsRef);
                let totalSeconds = 0;
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.date === today) {
                        totalSeconds += data.durationInSeconds || 0;
                    }
                });
                
                const hr = Math.floor(totalSeconds / 3600);
                const min = Math.floor((totalSeconds % 3600) / 60);
                
                if (hr > 0) {
                    document.getElementById('todayTotalTime').innerText = `${hr}시간 ${min}분`;
                } else {
                    document.getElementById('todayTotalTime').innerText = `${min}분`;
                }
            } catch (e) {
                console.error("총 시간 로드 에러:", e);
            }
        }

        document.getElementById('backToSubjectsBtn').onclick = async () => {
            await loadTodayTotalTime(); // 돌아갈 때 요약 업데이트
            showPage("subjectPage");
        };

        // -------------------------------------------------------------
        // 그래프 데이터 로드 (Chart.js)
        // -------------------------------------------------------------
        async function loadGraphData(subject) {
            if (!currentUser) return;
            document.getElementById('graphLoading').style.display = 'block';
            document.getElementById('studyChart').style.display = 'none';

            let snapshot;
            try {
                const sessionsRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'study_sessions');
                snapshot = await getDocs(sessionsRef);
            } catch (e) {
                showToast("데이터 불러오기 실패. 인터넷 연결을 확인하세요.");
                console.error(e);
                return;
            } finally {
                document.getElementById('graphLoading').style.display = 'none';
                document.getElementById('studyChart').style.display = 'block';
            }

            const dailyData = {};

            snapshot.forEach(doc => {
                const data = doc.data();
                if (data.subject === subject) {
                    const date = data.date;
                    if (!dailyData[date]) {
                        dailyData[date] = { seconds: 0, problems: 0 };
                    }
                    dailyData[date].seconds += (data.durationInSeconds || 0);
                    dailyData[date].problems += (data.problems || 0);
                }
            });

            const sortedDates = Object.keys(dailyData).sort();
            const labels = sortedDates.map(date => {
                const d = new Date(date);
                return `${d.getMonth() + 1}/${d.getDate()}`;
            });
            const durationData = sortedDates.map(date => Math.floor(dailyData[date].seconds / 60)); 
            const problemData = sortedDates.map(date => dailyData[date].problems);

            drawDualChart(labels, durationData, problemData);
        }

        function drawDualChart(labels, durationData, problemData) {
            const ctx = document.getElementById('studyChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '공부 시간 (분)',
                            data: durationData,
                            backgroundColor: 'rgba(79, 70, 229, 0.7)',
                            borderRadius: 6,
                            yAxisID: 'y'
                        },
                        {
                            label: '푼 문제 수',
                            data: problemData,
                            type: 'line',
                            borderColor: '#EF4444',
                            backgroundColor: '#EF4444',
                            borderWidth: 2,
                            tension: 0.3,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        y: { type: 'linear', display: true, position: 'left', title: { display: true, text: '시간 (분)' } },
                        y1: { type: 'linear', display: true, position: 'right', title: { display: true, text: '문제 수' }, grid: { drawOnChartArea: false } }
                    }
                }
            });
        }

        // -------------------------------------------------------------
        // 타이머 로직
        // -------------------------------------------------------------
        document.getElementById('startStudyBtn').onclick = () => {
            document.getElementById('timerSubjectTitle').innerText = currentSubject + " 공부 중 🚀";
            startTime = new Date();
            document.getElementById('timerDisplay').innerText = "00:00:00";
            timerInterval = setInterval(updateTimer, 1000);
            showPage("timerPage");
        };

        function updateTimer() {
            const now = new Date();
            const diff = now - startTime;
            
            const sec = Math.floor((diff / 1000) % 60);
            const min = Math.floor((diff / 60000) % 60);
            const hr = Math.floor(diff / 3600000);

            document.getElementById('timerDisplay').innerText = 
                String(hr).padStart(2, '0') + ":" + 
                String(min).padStart(2, '0') + ":" + 
                String(sec).padStart(2, '0');
        }

        document.getElementById('stopStudyBtn').onclick = () => {
            clearInterval(timerInterval);
            endTime = new Date();
            
            const totalSeconds = Math.floor((endTime - startTime) / 1000);
            const min = Math.floor(totalSeconds / 60);
            const sec = totalSeconds % 60;
            
            document.getElementById('resultTimeText').innerText = `${min}분 ${sec}초`;
            document.getElementById('problemInput').value = "";
            
            showPage("problemPage");
        };

        // -------------------------------------------------------------
        // 팝업 모달 & 실제 결과 저장 로직 연동
        // -------------------------------------------------------------
        
        // 1. "기록 저장하고 돌아가기" 버튼 클릭 시 -> 모달 띄우기
        document.getElementById('saveSessionBtn').onclick = () => {
            if (!currentUser) return;
            document.getElementById('permissionModal').classList.add('active');
        };

        // 2. 모달에서 "아니오(취소)" 클릭 시 -> 모달 닫기
        document.getElementById('denySaveBtn').onclick = () => {
            document.getElementById('permissionModal').classList.remove('active');
            showToast("저장이 취소되었습니다. 다시 진행해주세요.");
        };

        // 3. 모달에서 "허용 및 저장" 클릭 시 -> 실제 저장 진행
        document.getElementById('allowSaveBtn').onclick = async () => {
            // 모달 닫기
            document.getElementById('permissionModal').classList.remove('active');

            const btn = document.getElementById('saveSessionBtn');
            btn.disabled = true;
            btn.innerText = "저장 중...";

            const durationInSeconds = Math.floor((endTime - startTime) / 1000);
            const problems = Number(document.getElementById('problemInput').value) || 0;
            const todayDate = getTodayDateString();

            const sessionData = {
                subject: currentSubject,
                date: todayDate,
                startTime: startTime.toISOString(),
                endTime: endTime.toISOString(),
                durationInSeconds: durationInSeconds,
                problems: problems,
                timestamp: new Date().toISOString()
            };

            try {
                // 내부 인증 로직 변경으로 권한 에러 없이 정상 통과!
                const sessionsRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'study_sessions');
                await addDoc(sessionsRef, sessionData);
                
                showToast("기록이 성공적으로 저장되었습니다!");
                await loadGraphData(currentSubject); // 그래프 리로드
                
                btn.disabled = false;
                btn.innerText = "기록 저장하고 돌아가기";
                showPage("graphPage"); // 그래프 페이지로 귀환
            } catch (error) {
                showToast("저장 에러가 발생했습니다.");
                console.error(error);
                btn.disabled = false;
                btn.innerText = "다시 시도하기";
            }
        };
    </script>
</body>
</html>
